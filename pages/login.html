<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythic Clash - Iniciar Sesión</title>
  <meta name="description" content="Accede a tu cuenta de Mythic Clash para guardar tus cartas y progreso.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- HEADER & NAVEGACIÓN PRINCIPAL -->
  <header class="main-header">
    <a href="../index.html" class="brand-logo">
      <div class="brand-icon">⚔️</div>
      <span class="brand-name">MYTHIC CLASH</span>
    </a>

    <nav>
      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link">🏠 Inicio</a></li>
        <li><a href="collection.html" class="nav-link">🎴 Colección & Mazo</a></li>
        <li><a href="battle.html" class="nav-link">⚔️ Arena de Batalla</a></li>
        <li><a href="login.html" class="nav-link active">🔐 Iniciar Sesión</a></li>
      </ul>
    </nav>

    <div class="user-status-pill">
      <div class="user-avatar">J</div>
      <div class="user-info">
        <span class="user-name">Invitado</span>
        <span class="user-rank">Sin Sesión</span>
      </div>
    </div>
  </header>

  <!-- PÁGINA DE INICIO DE SESIÓN / REGISTRO -->
  <main class="page-view active">
    <div class="auth-page-container">
      <div class="auth-card-glass">
        
        <div class="auth-tabs">
          <button class="auth-tab-btn active" id="tab-login">Iniciar Sesión</button>
          <button class="auth-tab-btn" id="tab-register">Registrarse</button>
        </div>

        <form class="auth-form" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label for="auth-email">Correo Electrónico o Usuario</label>
            <input type="text" id="auth-email" class="form-input" placeholder="ejemplo@mythicclash.com" required>
          </div>

          <div class="form-group">
            <label for="auth-password">Contraseña</label>
            <input type="password" id="auth-password" class="form-input" placeholder="••••••••" required>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #94a3b8;">
            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
              <input type="checkbox"> Recordarme
            </label>
            <a href="#" style="color: var(--neon-cyan); text-decoration: none;">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="auth-submit-btn">ENTRAR A LA ARENA 🚀</button>
        </form>

      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
