<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythic Clash - Colección y Mazo</title>
  <meta name="description" content="Selecciona tus 5 cartas para construir tu mazo de batalla.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- HEADER & NAVEGACIÓN PRINCIPAL -->
  <header class="main-header">
    <a href="../index.html" class="brand-logo">
      <div class="brand-icon">⚔️</div>
      <span class="brand-name">MYTHIC CLASH</span>
    </a>

    <nav>
      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link">🏠 Inicio</a></li>
        <li><a href="collection.html" class="nav-link active">🎴 Colección & Mazo</a></li>
        <li><a href="battle.html" class="nav-link">⚔️ Arena de Batalla</a></li>
        <li><a href="login.html" class="nav-link">🔐 Iniciar Sesión</a></li>
      </ul>
    </nav>

    <div class="user-status-pill">
      <div class="user-avatar">J</div>
      <div class="user-info">
        <span class="user-name">Jugador 1</span>
        <span class="user-rank">Nivel 5 • Rango Guerrero</span>
      </div>
    </div>
  </header>

  <!-- PÁGINA DE COLECCIÓN Y SELECTOR DE MAZO DE 5 CARTAS -->
  <main class="page-view active">
    <div class="collection-container">
      
      <!-- Zona Superior: Selector de Mazo (5 Slots Vacíos para renderizar con JS) -->
      <section class="deck-builder-section" id="deck-builder">
        <div class="deck-header">
          <div class="deck-title-group">
            <h2>Mazo Seleccionado</h2>
            <span class="deck-count-badge" id="deck-counter">0 / 5 Cartas</span>
          </div>
          <div class="deck-stats">
            <div class="stat-item">Mana Prom: <span id="stat-mana">0.0</span></div>
            <div class="stat-item">Daño Total: <span id="stat-damage">0</span></div>
            <button class="btn btn-primary" id="btn-start-battle" disabled style="opacity: 0.5; cursor: not-allowed;">¡INICIAR BATALLA! ⚔️</button>
          </div>
        </div>

        <!-- 5 Espacios / Slots Vacíos para las cartas seleccionadas -->
        <div class="deck-slots-grid" id="deck-slots-container">
          <div class="deck-slot empty" id="deck-slot-1" data-slot="1">
            <div class="slot-icon">➕</div>
            <div class="slot-number">SLOT 1</div>
            <span style="font-size: 0.7rem; color: #94a3b8; margin-top: 0.2rem;">Vacío</span>
          </div>

          <div class="deck-slot empty" id="deck-slot-2" data-slot="2">
            <div class="slot-icon">➕</div>
            <div class="slot-number">SLOT 2</div>
            <span style="font-size: 0.7rem; color: #94a3b8; margin-top: 0.2rem;">Vacío</span>
          </div>

          <div class="deck-slot empty" id="deck-slot-3" data-slot="3">
            <div class="slot-icon">➕</div>
            <div class="slot-number">SLOT 3</div>
            <span style="font-size: 0.7rem; color: #94a3b8; margin-top: 0.2rem;">Vacío</span>
          </div>

          <div class="deck-slot empty" id="deck-slot-4" data-slot="4">
            <div class="slot-icon">➕</div>
            <div class="slot-number">SLOT 4</div>
            <span style="font-size: 0.7rem; color: #94a3b8; margin-top: 0.2rem;">Vacío</span>
          </div>

          <div class="deck-slot empty" id="deck-slot-5" data-slot="5">
            <div class="slot-icon">➕</div>
            <div class="slot-number">SLOT 5</div>
            <span style="font-size: 0.7rem; color: #94a3b8; margin-top: 0.2rem;">Vacío</span>
          </div>
        </div>
      </section>

      <!-- Barra de Búsqueda y Filtros de la Colección -->
      <section class="filter-bar">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="card-search-input" placeholder="Buscar por nombre de carta...">
        </div>
        <div class="element-filter-pills">
          <button class="filter-pill active" data-filter="all">Todos</button>
          <button class="filter-pill" data-filter="fire">🔥 Fuego</button>
          <button class="filter-pill" data-filter="water">❄️ Agua</button>
          <button class="filter-pill" data-filter="earth">🌿 Tierra</button>
          <button class="filter-pill" data-filter="dark">🔮 Oscuridad</button>
        </div>
      </section>

      <!-- Grilla de la Colección General de Cartas Disponibles (Renderizado dinámicamente con JS) -->
      <section class="cards-collection-grid" id="collection-grid">
      </section>

    </div>
  </main>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
