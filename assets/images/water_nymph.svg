<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="60%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Swirling Water Waves -->
  <path d="M 150 450 C 250 350 400 550 500 400 C 600 250 750 450 650 600 C 550 750 250 650 150 450 Z" fill="#22d3ee" opacity="0.5" filter="url(#glow)"/>
  <circle cx="400" cy="380" r="140" fill="#67e8f9" opacity="0.7" filter="url(#glow)"/>

  <!-- Water Fairy Silhouette -->
  <ellipse cx="400" cy="360" rx="30" ry="50" fill="#ecfeff"/>
  <circle cx="400" cy="285" r="28" fill="#cffafe" filter="url(#glow)"/>
  
  <!-- Floating Bubbles -->
  <circle cx="280" cy="240" r="16" fill="none" stroke="#a5f3fc" stroke-width="4" filter="url(#glow)"/>
  <circle cx="530" cy="220" r="22" fill="none" stroke="#a5f3fc" stroke-width="5" filter="url(#glow)"/>
  <circle cx="220" cy="520" r="28" fill="none" stroke="#cffafe" stroke-width="6" filter="url(#glow)"/>
</svg>
