<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#180e04"/>
    </radialGradient>
    <radialGradient id="sunBurst" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="350" r="260" fill="url(#sunBurst)" filter="url(#glow)"/>

  <!-- Sun Rays -->
  <g stroke="#fbbf24" stroke-width="8" filter="url(#glow)">
    <line x1="400" y1="50" x2="400" y2="130"/>
    <line x1="400" y1="570" x2="400" y2="650"/>
    <line x1="140" y1="350" x2="220" y2="350"/>
    <line x1="580" y1="350" x2="660" y2="350"/>
    <line x1="216" y1="166" x2="272" y2="222"/>
    <line x1="528" y1="478" x2="584" y2="534"/>
    <line x1="584" y1="166" x2="528" y2="222"/>
    <line x1="272" y1="478" x2="216" y2="534"/>
  </g>

  <!-- Solar Warrior Mask Silhouette -->
  <polygon points="400,220 320,380 400,500 480,380" fill="#ea580c" stroke="#fef08a" stroke-width="6"/>
  <circle cx="360" cy="360" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="440" cy="360" r="14" fill="#ffffff" filter="url(#glow)"/>
</svg>
