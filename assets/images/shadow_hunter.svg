<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1035"/>
      <stop offset="70%" stop-color="#0d0618"/>
      <stop offset="100%" stop-color="#04020a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Crescent Moon Background -->
  <path d="M 450 150 A 200 200 0 1 0 650 350 A 220 220 0 1 1 450 150 Z" fill="#c084fc" filter="url(#glow)" opacity="0.4"/>

  <!-- Shadow Hunter Silhouette -->
  <!-- Hood & Shoulders -->
  <path d="M 330 650 L 320 400 L 350 250 Q 400 210 450 250 L 480 400 L 470 650 Z" fill="#0f172a"/>
  <path d="M 400 210 Q 330 230 350 320 L 450 320 Q 470 230 400 210 Z" fill="#1e1b4b"/>
  
  <!-- Glowing Violet Eyes -->
  <ellipse cx="400" cy="275" rx="35" ry="25" fill="#020617"/>
  <ellipse cx="385" cy="275" rx="6" ry="4" fill="#c084fc" filter="url(#glow)"/>
  <ellipse cx="415" cy="275" rx="6" ry="4" fill="#c084fc" filter="url(#glow)"/>

  <!-- Shadow Crossbow -->
  <path d="M 220 380 Q 320 350 420 380" stroke="#a855f7" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="320" y1="365" x2="320" y2="480" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="320" y1="340" x2="320" y2="390" stroke="#e9d5ff" stroke-width="4" filter="url(#glow)"/>
</svg>
