<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="starlight" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="380" r="280" fill="url(#starlight)" filter="url(#glow)"/>

  <!-- Stars background -->
  <circle cx="200" cy="180" r="4" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="620" cy="160" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="6" fill="#c7d2fe" filter="url(#glow)"/>
  <circle cx="660" cy="480" r="4" fill="#ffffff" filter="url(#glow)"/>

  <!-- Celestial Armor Sentinel -->
  <path d="M 330 650 L 320 400 L 350 250 Q 400 180 450 250 L 480 400 L 470 650 Z" fill="#312e81"/>
  <polygon points="400,200 340,300 400,420 460,300" fill="#4338ca" stroke="#c7d2fe" stroke-width="4"/>

  <!-- Astral Crest & Eyes -->
  <circle cx="400" cy="280" r="25" fill="#e0e7ff" filter="url(#glow)"/>
  <polygon points="400,140 415,180 400,170 385,180" fill="#fef08a" filter="url(#glow)"/>
</svg>
