<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Lightning Bolts -->
  <path d="M 200 50 L 260 250 L 210 270 L 320 500" stroke="#38bdf8" stroke-width="8" fill="none" filter="url(#glow)"/>
  <path d="M 600 80 L 520 280 L 560 300 L 480 480" stroke="#38bdf8" stroke-width="8" fill="none" filter="url(#glow)"/>
  <path d="M 400 100 L 380 220 L 430 240 L 390 350" stroke="#e0f2fe" stroke-width="10" fill="none" filter="url(#glow)"/>

  <!-- Tribal Shaman Mask & Body -->
  <path d="M 320 650 L 300 450 L 340 320 L 460 320 L 500 450 L 480 650 Z" fill="#334155"/>
  <!-- Horned Shaman Helmet/Mask -->
  <path d="M 320 320 C 260 220 200 240 220 160 C 260 200 320 250 350 300 Z" fill="#78350f"/>
  <path d="M 480 320 C 540 220 600 240 580 160 C 540 200 480 250 450 300 Z" fill="#78350f"/>
  <rect x="350" y="270" width="100" height="110" rx="20" fill="#0f172a" stroke="#0284c7" stroke-width="6"/>

  <!-- Electric Glowing Eye Slots -->
  <polygon points="370,300 395,300 382,320" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="405,300 430,300 417,320" fill="#38bdf8" filter="url(#glow)"/>
</svg>
