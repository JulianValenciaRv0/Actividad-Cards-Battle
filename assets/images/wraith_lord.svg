<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011711"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Spectral Cloak & Crown -->
  <path d="M 320 650 L 300 420 L 340 260 L 460 260 L 500 420 L 480 650 Z" fill="#064e3b" opacity="0.8"/>
  <polygon points="350,260 370,180 400,240 430,180 450,260" fill="#a7f3d0" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>

  <!-- Ethereal Void Face -->
  <ellipse cx="400" cy="300" rx="35" ry="25" fill="#022c22"/>
  <circle cx="385" cy="300" r="6" fill="#34d399" filter="url(#glow)"/>
  <circle cx="415" cy="300" r="6" fill="#34d399" filter="url(#glow)"/>

  <!-- Phantom Mist Trails -->
  <path d="M 200 500 Q 300 380 400 550 Q 500 720 600 500" stroke="#10b981" stroke-width="8" fill="none" opacity="0.6" filter="url(#glow)"/>
</svg>
