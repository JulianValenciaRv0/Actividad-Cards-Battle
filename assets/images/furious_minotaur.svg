<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="70%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Giant Curved Bull Horns -->
  <path d="M 320 280 Q 200 180 120 240 Q 220 320 300 320 Z" fill="#e2e8f0" stroke="#78350f" stroke-width="6"/>
  <path d="M 480 280 Q 600 180 680 240 Q 580 320 500 320 Z" fill="#e2e8f0" stroke="#78350f" stroke-width="6"/>

  <!-- Minotaur Head & Shoulders -->
  <path d="M 240 650 L 260 400 L 320 280 L 480 280 L 540 400 L 560 650 Z" fill="#451a03"/>
  <path d="M 330 280 Q 400 240 470 280 L 490 420 Q 400 480 310 420 Z" fill="#292524"/>

  <!-- Glowing Fiery Red Eyes & Nose Ring -->
  <circle cx="365" cy="340" r="10" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="435" cy="340" r="10" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="400" cy="410" r="22" fill="none" stroke="#f59e0b" stroke-width="8"/>

  <!-- Battleaxe -->
  <line x1="180" y1="200" x2="280" y2="600" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>
  <path d="M 160 200 Q 100 260 160 320 Q 220 260 160 200 Z" fill="#94a3b8" stroke="#f59e0b" stroke-width="4"/>
</svg>
