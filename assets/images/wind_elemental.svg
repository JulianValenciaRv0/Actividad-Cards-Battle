<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f2b3c"/>
      <stop offset="70%" stop-color="#081420"/>
      <stop offset="100%" stop-color="#02080d"/>
    </radialGradient>
    <radialGradient id="windGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f2b3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="300" fill="url(#windGlow)"/>

  <!-- Swirling Wind Vortex Trails -->
  <path d="M 400 150 C 600 180 650 400 450 550 C 250 700 150 450 300 300 C 450 150 600 300 400 450" fill="none" stroke="#67e8f9" stroke-width="14" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  <path d="M 350 200 C 500 220 580 380 420 500 C 260 620 200 420 320 320" fill="none" stroke="#a5f3fc" stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <path d="M 250 500 C 200 350 350 220 500 250 C 620 280 600 480 400 600" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Elemental Core Body -->
  <ellipse cx="400" cy="380" rx="60" ry="120" fill="#a5f3fc" filter="url(#glow)"/>
  <circle cx="400" cy="320" r="35" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="385" cy="315" r="7" fill="#0891b2"/>
  <circle cx="415" cy="315" r="7" fill="#0891b2"/>

  <!-- Floating wind embers -->
  <circle cx="220" cy="220" r="8" fill="#67e8f9" filter="url(#glow)"/>
  <circle cx="600" cy="220" r="12" fill="#67e8f9" filter="url(#glow)"/>
  <circle cx="640" cy="520" r="10" fill="#a5f3fc" filter="url(#glow)"/>
  <circle cx="180" cy="580" r="14" fill="#22d3ee" filter="url(#glow)"/>
</svg>
