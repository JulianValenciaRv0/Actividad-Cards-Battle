<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Golden Gryphon Wings -->
  <path d="M 400 380 Q 200 150 100 250 Q 250 400 380 420 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4" filter="url(#glow)"/>
  <path d="M 400 380 Q 600 150 700 250 Q 550 400 420 420 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4" filter="url(#glow)"/>

  <!-- Eagle Head & Lion Body -->
  <path d="M 330 650 L 320 450 L 370 280 L 430 280 L 480 450 L 470 650 Z" fill="#d97706"/>
  <!-- Beak -->
  <polygon points="400,280 470,330 400,350" fill="#fef08a" stroke="#b45309" stroke-width="4" filter="url(#glow)"/>
  <circle cx="380" cy="300" r="8" fill="#1c1917"/>
</svg>
