<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180202"/>
    </radialGradient>
    <radialGradient id="magmaCore" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="380" r="260" fill="url(#magmaCore)" filter="url(#glow)"/>

  <!-- Colossal Magma Rock Armor -->
  <path d="M 280 650 L 300 380 L 340 220 L 460 220 L 500 380 L 520 650 Z" fill="#1c1917" stroke="#dc2626" stroke-width="8"/>
  
  <!-- Lava Cracks -->
  <path d="M 400 220 L 400 650" stroke="#f97316" stroke-width="12" filter="url(#glow)"/>
  <path d="M 340 380 L 460 380" stroke="#f97316" stroke-width="10" filter="url(#glow)"/>
  <path d="M 320 500 L 480 500" stroke="#fef08a" stroke-width="8" filter="url(#glow)"/>

  <!-- Fiery Eyes -->
  <circle cx="370" cy="280" r="12" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="430" cy="280" r="12" fill="#fef08a" filter="url(#glow)"/>
</svg>
