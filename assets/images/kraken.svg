<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#032b43"/>
      <stop offset="60%" stop-color="#011627"/>
      <stop offset="100%" stop-color="#000914"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Tentacles -->
  <path d="M 400 450 C 300 300 150 320 100 200 C 60 100 180 80 220 180 C 250 250 350 380 400 450 Z" fill="#0284c7" opacity="0.9"/>
  <path d="M 400 450 C 500 300 650 320 700 200 C 740 100 620 80 580 180 C 550 250 450 380 400 450 Z" fill="#0369a1" opacity="0.9"/>
  <path d="M 380 480 C 250 500 120 600 80 720 C 150 750 250 680 340 540 Z" fill="#075985"/>
  <path d="M 420 480 C 550 500 680 600 720 720 C 650 750 550 680 460 540 Z" fill="#0c4a6e"/>

  <!-- Tentacle Suckers -->
  <circle cx="150" cy="220" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="180" cy="160" r="12" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="650" cy="220" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="620" cy="160" r="12" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Kraken Head & Glowing Eyes -->
  <path d="M 300 450 C 300 300 500 300 500 450 Q 520 540 400 560 Q 280 540 300 450 Z" fill="#0f172a"/>
  <circle cx="350" cy="430" r="22" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="350" cy="430" r="8" fill="#fef08a"/>
  <circle cx="450" cy="430" r="22" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="450" cy="430" r="8" fill="#fef08a"/>

  <!-- Water Bubbles -->
  <circle cx="400" cy="250" r="10" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="320" cy="180" r="15" fill="#7dd3fc" opacity="0.4"/>
  <circle cx="480" cy="150" r="8" fill="#7dd3fc" opacity="0.7"/>
</svg>
